
<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Machine Maintenance Scheduler</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
}

body {
    background: #f3f4f6;
    color: #1f2937;
    padding: 30px;
}

.container {
    max-width: 1200px;
    margin: auto;
}

/* =========================
   BACK LINK
========================= */

.back-link {
    display: inline-block;
    margin-bottom: 20px;
    padding: 9px 15px;
    background: #2563eb;
    color: white;
    text-decoration: none;
    border-radius: 6px;
}

.back-link:hover {
    background: #1d4ed8;
}

/* =========================
   TITLE
========================= */

h1 {
    text-align: center;
    margin-bottom: 8px;
    color: #111827;
}

.subtitle {
    text-align: center;
    color: #6b7280;
    margin-bottom: 25px;
}

/* =========================
   CONTROLS
========================= */

.controls {
    background: white;
    padding: 20px;
    border-radius: 10px;
    margin-bottom: 25px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}

.controls label {
    font-weight: bold;
}

.controls input {
    padding: 10px 12px;
    margin-left: 10px;
    border: 1px solid #d1d5db;
    border-radius: 6px;
    font-size: 15px;
    width: 160px;
}

.controls input:focus {
    outline: none;
    border-color: #2563eb;
    box-shadow: 0 0 0 2px rgba(37,99,235,0.15);
}

.date-help {
    margin-top: 8px;
    margin-left: 165px;
    color: #6b7280;
    font-size: 13px;
}

/* =========================
   SCHEDULE
========================= */

.schedule {
    display: grid;
    grid-template-columns: repeat(
        auto-fit,
        minmax(320px, 1fr)
    );
    gap: 20px;
}

/* =========================
   WEEK
========================= */

.week {
    background: white;
    padding: 20px;
    border-radius: 10px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}

.week h2 {
    color: #2563eb;
    margin-bottom: 5px;
}

.week-date {
    color: #6b7280;
    font-size: 14px;
    margin-bottom: 18px;
}

/* =========================
   MACHINE
========================= */

.machine {
    background: #f9fafb;
    padding: 15px;
    margin-bottom: 12px;
    border-left: 5px solid #f59e0b;
    border-radius: 7px;
}

.machine.completed {
    background: #f0fdf4;
    border-left-color: #16a34a;
}

.machine-name {
    font-size: 18px;
    font-weight: bold;
}

.maintenance-day {
    color: #2563eb;
    font-weight: bold;
    margin-top: 6px;
}

.maintenance-date {
    color: #6b7280;
    font-size: 13px;
    margin-top: 4px;
}

.status {
    font-size: 13px;
    margin-top: 8px;
    color: #f59e0b;
}

.completed .status {
    color: #16a34a;
}

/* =========================
   BUTTON
========================= */

.complete-btn {
    margin-top: 10px;
    padding: 8px 14px;
    border: none;
    border-radius: 5px;
    background: #2563eb;
    color: white;
    cursor: pointer;
    font-size: 14px;
}

.complete-btn:hover {
    background: #1d4ed8;
}

.complete-btn.undo {
    background: #6b7280;
}

.complete-btn.undo:hover {
    background: #4b5563;
}

/* =========================
   SUMMARY
========================= */

.summary {
    margin-top: 25px;
    background: white;
    padding: 20px;
    border-radius: 10px;
    display: flex;
    justify-content: space-around;
    text-align: center;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}

.summary-item {
    min-width: 150px;
}

.number {
    display: block;
    font-size: 30px;
    font-weight: bold;
    color: #2563eb;
    margin-bottom: 5px;
}

/* =========================
   RESPONSIVE
========================= */

@media (max-width: 600px) {

    body {
        padding: 15px;
    }

    .summary {
        flex-direction: column;
        gap: 20px;
    }

    .controls input {
        margin-left: 0;
        margin-top: 10px;
        display: block;
    }

    .date-help {
        margin-left: 0;
    }

}

</style>

</head>


<body>


<a
    class="back-link"
    href="https://etachali2-prog.github.io/all/"
>
    ← Back
</a>


<div class="container">


<h1>
    Machine Maintenance Scheduler
</h1>


<p class="subtitle">
    15 Machines • 3 Machines Per Week • Weekdays Only
</p>


<!-- =================================================
     MANUAL START DATE
================================================== -->

<div class="controls">

    <label for="startDate">
        Schedule Start Date:
    </label>

    <!--
        NORMAL TEXT INPUT
        NO CALENDAR
    -->

    <input
        type="text"
        id="startDate"
        placeholder="DD/MM/YYYY"
        maxlength="10"
        autocomplete="off"
    >

    <div class="date-help">
        Enter date manually, for example: 01/10/2026
    </div>

</div>


<!-- =================================================
     SCHEDULE
================================================== -->

<div
    id="schedule"
    class="schedule"
>
</div>


<!-- =================================================
     SUMMARY
================================================== -->

<div class="summary">


    <div class="summary-item">

        <span
            id="total"
            class="number"
        >
            15
        </span>

        Total Machines

    </div>


    <div class="summary-item">

        <span
            id="completed"
            class="number"
        >
            0
        </span>

        Completed

    </div>


    <div class="summary-item">

        <span
            id="pending"
            class="number"
        >
            15
        </span>

        Pending

    </div>


</div>


</div>


<script>


/* =====================================================
   PASSWORD
===================================================== */

const PASSWORD = "123";


/* =====================================================
   MACHINE LIST
===================================================== */

const MACHINES = [

    {
        id: "TBO1",
        name: "TBO1"
    },

    {
        id: "TBO2",
        name: "TBO2"
    },

    {
        id: "KOLBUS_ONLINE",
        name: "KOLBUS (ONLINE)"
    },

    {
        id: "KOLBUS_OFFLINE",
        name: "KOLBUS (OFFLINE)"
    },

    {
        id: "OSAKO",
        name: "OSAKO"
    },

    {
        id: "THREE_KNIFE",
        name: "THREE KNIFE"
    },

    {
        id: "SAKURAI_UNIT_2",
        name: "SAKURAI UNIT 2"
    },

    {
        id: "SAKURAI_UNIT_1_A",
        name: "SAKURAI UNIT 1 - A"
    },

    {
        id: "SAKURAI_UNIT_1_B",
        name: "SAKURAI UNIT 1 - B"
    },

    {
        id: "LAMINATING_MACHINE",
        name: "LAMINATING MACHINE"
    },

    {
        id: "SINGLE_KNIFE",
        name: "SINGLE KNIFE"
    },

    {
        id: "CTP",
        name: "CTP"
    },

    {
        id: "GENERATOR",
        name: "GENERATOR"
    },

    {
        id: "KOMPRESSOR_WEB",
        name: "KOMPRESSOR (WEB)"
    },

    {
        id: "KOMPRESSOR_KOLBUS",
        name: "KOMPRESSOR (KOLBUS)"
    }

];


/* =====================================================
   SETTINGS
===================================================== */

const TOTAL_MACHINES =
    MACHINES.length;

const MACHINES_PER_WEEK = 3;

const TOTAL_WEEKS =
    Math.ceil(
        TOTAL_MACHINES /
        MACHINES_PER_WEEK
    );


/*
    Maintenance days:

    Monday
    Wednesday
    Friday
*/

const MAINTENANCE_DAYS = [
    1,
    3,
    5
];


/* =====================================================
   LOCAL STORAGE
===================================================== */

let maintenanceStatus =
    JSON.parse(
        localStorage.getItem(
            "maintenanceStatus"
        )
    ) || {};


let savedStartDate =
    localStorage.getItem(
        "maintenanceStartDate"
    ) || "";


/* =====================================================
   ELEMENTS
===================================================== */

const scheduleElement =
    document.getElementById(
        "schedule"
    );


const startDateInput =
    document.getElementById(
        "startDate"
    );


/* =====================================================
   LOAD SAVED DATE
===================================================== */

if (savedStartDate) {

    startDateInput.value =
        savedStartDate;

    startDateInput.dataset.previousDate =
        savedStartDate;

}

else {

    startDateInput.value = "";

    startDateInput.dataset.previousDate =
        "";

}


/* =====================================================
   DATE VALIDATION
===================================================== */

function isValidDateFormat(dateString) {

    /*
        Required format:

        DD/MM/YYYY

        Example:

        01/10/2026
    */

    const pattern =
        /^(\d{2})\/(\d{2})\/(\d{4})$/;


    const match =
        dateString.match(pattern);


    if (!match) {

        return false;

    }


    const day =
        parseInt(match[1], 10);

    const month =
        parseInt(match[2], 10);

    const year =
        parseInt(match[3], 10);


    /*
        Basic range checking.
    */

    if (
        month < 1 ||
        month > 12
    ) {

        return false;

    }


    if (
        day < 1 ||
        day > 31
    ) {

        return false;

    }


    /*
        Create date and verify it.
    */

    const date =
        new Date(
            year,
            month - 1,
            day
        );


    return (
        date.getFullYear() === year &&
        date.getMonth() === month - 1 &&
        date.getDate() === day
    );

}


/* =====================================================
   CONVERT DD/MM/YYYY TO JAVASCRIPT DATE
===================================================== */

function convertToDate(dateString) {

    const parts =
        dateString.split("/");


    const day =
        parseInt(parts[0], 10);

    const month =
        parseInt(parts[1], 10);

    const year =
        parseInt(parts[2], 10);


    return new Date(
        year,
        month - 1,
        day
    );

}


/* =====================================================
   DATE FUNCTIONS
===================================================== */

function isWeekend(date) {

    const day =
        date.getDay();

    return (
        day === 0 ||
        day === 6
    );

}


function getNextWeekday(date) {

    const result =
        new Date(date);


    while (
        isWeekend(result)
    ) {

        result.setDate(
            result.getDate() + 1
        );

    }


    return result;

}


function getMonday(date) {

    const result =
        new Date(date);


    const day =
        result.getDay();


    if (day === 0) {

        result.setDate(
            result.getDate() - 6
        );

    }

    else {

        result.setDate(
            result.getDate() -
            (day - 1)
        );

    }


    return result;

}


function addDays(date, days) {

    const result =
        new Date(date);


    result.setDate(
        result.getDate() + days
    );


    return result;

}


function formatDate(date) {

    return date.toLocaleDateString(
        "en-US",
        {
            weekday: "long",
            year: "numeric",
            month: "short",
            day: "numeric"
        }
    );

}


/* =====================================================
   PASSWORD
===================================================== */

function checkPassword(message) {

    const enteredPassword =
        prompt(message);


    /*
        Cancel
    */

    if (
        enteredPassword === null
    ) {

        return false;

    }


    /*
        Wrong password
    */

    if (
        enteredPassword !== PASSWORD
    ) {

        alert(
            "Incorrect password!"
        );

        return false;

    }


    return true;

}


/* =====================================================
   GENERATE SCHEDULE
===================================================== */

function generateSchedule() {

    scheduleElement.innerHTML = "";


    /*
        No date entered.
    */

    if (!startDateInput.value) {

        scheduleElement.innerHTML = `

            <div class="week">

                <h2>
                    Schedule Not Started
                </h2>

                <div class="week-date">

                    Please enter the
                    Schedule Start Date
                    above.

                </div>

            </div>

        `;

        updateSummary();

        return;

    }


    /*
        Convert entered date.
    */

    const selectedDate =
        convertToDate(
            startDateInput.value
        );


    /*
        Get Monday of that week.
    */

    const firstMonday =
        getMonday(
            selectedDate
        );


    /* =================================================
       CREATE WEEKS
    ================================================= */

    for (
        let week = 1;
        week <= TOTAL_WEEKS;
        week++
    ) {


        const monday =
            addDays(
                firstMonday,
                (week - 1) * 7
            );


        const friday =
            addDays(
                monday,
                4
            );


        const weekCard =
            document.createElement(
                "div"
            );


        weekCard.className =
            "week";


        weekCard.innerHTML = `

            <h2>
                Week ${week}
            </h2>

            <div class="week-date">

                ${formatDate(monday)}
                -
                ${formatDate(friday)}

            </div>

        `;


        /* =================================================
           MACHINES
        ================================================= */

        const firstMachineIndex =
            (week - 1) *
            MACHINES_PER_WEEK;


        for (
            let i = 0;
            i < MACHINES_PER_WEEK;
            i++
        ) {


            const machineIndex =
                firstMachineIndex + i;


            if (
                machineIndex >=
                TOTAL_MACHINES
            ) {

                break;

            }


            const machine =
                MACHINES[
                    machineIndex
                ];


            /*
                Monday = 1
                Wednesday = 3
                Friday = 5
            */

            const dayOffset =
                MAINTENANCE_DAYS[i] - 1;


            let maintenanceDate =
                addDays(
                    monday,
                    dayOffset
                );


            /*
                Ensure weekday.
            */

            if (
                isWeekend(
                    maintenanceDate
                )
            ) {

                maintenanceDate =
                    getNextWeekday(
                        maintenanceDate
                    );

            }


            /*
                Check completion.
            */

            const completed =
                maintenanceStatus[
                    machine.id
                ] === true;


            /* =================================================
               MACHINE CARD
            ================================================= */

            const machineCard =
                document.createElement(
                    "div"
                );


            machineCard.className =
                completed
                    ? "machine completed"
                    : "machine";


            /* =================================================
               MACHINE NAME
            ================================================= */

            const machineName =
                document.createElement(
                    "div"
                );


            machineName.className =
                "machine-name";


            machineName.textContent =
                machine.name;


            /* =================================================
               DAY
            ================================================= */

            const maintenanceDay =
                document.createElement(
                    "div"
                );


            maintenanceDay.className =
                "maintenance-day";


            maintenanceDay.textContent =
                maintenanceDate.toLocaleDateString(
                    "en-US",
                    {
                        weekday: "long"
                    }
                );


            /* =================================================
               DATE
            ================================================= */

            const maintenanceDateElement =
                document.createElement(
                    "div"
                );


            maintenanceDateElement.className =
                "maintenance-date";


            maintenanceDateElement.textContent =
                maintenanceDate.toLocaleDateString(
                    "en-US",
                    {
                        month: "short",
                        day: "numeric",
                        year: "numeric"
                    }
                );


            /* =================================================
               STATUS
            ================================================= */

            const status =
                document.createElement(
                    "div"
                );


            status.className =
                "status";


            status.textContent =
                completed
                    ? "✓ Maintenance Completed"
                    : "⚠ Maintenance Pending";


            /* =================================================
               BUTTON
            ================================================= */

            const button =
                document.createElement(
                    "button"
                );


            button.className =
                "complete-btn";


            if (completed) {

                button.textContent =
                    "Undo";

                button.classList.add(
                    "undo"
                );

            }

            else {

                button.textContent =
                    "Mark Completed";

            }


            /* =================================================
               BUTTON ACTION
            ================================================= */

            button.addEventListener(
                "click",
                function() {

                    toggleMaintenance(
                        machine.id
                    );

                }
            );


            /* =================================================
               ADD ELEMENTS
            ================================================= */

            machineCard.appendChild(
                machineName
            );

            machineCard.appendChild(
                maintenanceDay
            );

            machineCard.appendChild(
                maintenanceDateElement
            );

            machineCard.appendChild(
                status
            );

            machineCard.appendChild(
                button
            );


            weekCard.appendChild(
                machineCard
            );

        }


        scheduleElement.appendChild(
            weekCard
        );

    }


    updateSummary();

}


/* =====================================================
   COMPLETE / UNDO
===================================================== */

function toggleMaintenance(
    machineId
) {


    const isCompleted =
        maintenanceStatus[
            machineId
        ] === true;


    /*
        ==========================
        UNDO
        ==========================
    */

    if (isCompleted) {

        maintenanceStatus[
            machineId
        ] = false;

    }


    /*
        ==========================
        COMPLETE
        ==========================
    */

    else {


        const passwordCorrect =
            checkPassword(
                "Enter maintenance password:"
            );


        if (!passwordCorrect) {

            return;

        }


        maintenanceStatus[
            machineId
        ] = true;

    }


    /*
        Save status.
    */

    localStorage.setItem(
        "maintenanceStatus",
        JSON.stringify(
            maintenanceStatus
        )
    );


    /*
        Refresh.
    */

    generateSchedule();

}


/* =====================================================
   SUMMARY
===================================================== */

function updateSummary() {


    const completed =
        MACHINES.filter(
            machine =>
                maintenanceStatus[
                    machine.id
                ] === true
        ).length;


    document.getElementById(
        "total"
    ).textContent =
        TOTAL_MACHINES;


    document.getElementById(
        "completed"
    ).textContent =
        completed;


    document.getElementById(
        "pending"
    ).textContent =
        TOTAL_MACHINES -
        completed;

}


/* =====================================================
   START DATE CHANGE
===================================================== */

startDateInput.addEventListener(
    "change",
    function() {


        const newDate =
            startDateInput.value.trim();


        /*
            Empty field.
        */

        if (!newDate) {

            startDateInput.value =
                startDateInput.dataset.previousDate;

            return;

        }


        /*
            Check DD/MM/YYYY format.
        */

        if (
            !isValidDateFormat(
                newDate
            )
        ) {

            alert(
                "Invalid date.\n\n" +
                "Please enter the date as DD/MM/YYYY.\n\n" +
                "Example: 01/10/2026"
            );


            startDateInput.value =
                startDateInput.dataset.previousDate;

            return;

        }


        /*
            Ask password.
        */

        const passwordCorrect =
            checkPassword(
                "Enter password to change the maintenance start date:"
            );


        /*
            Wrong password.
        */

        if (!passwordCorrect) {

            startDateInput.value =
                startDateInput.dataset.previousDate;

            return;

        }


        /*
            Save date.
        */

        localStorage.setItem(
            "maintenanceStartDate",
            newDate
        );


        startDateInput.dataset.previousDate =
            newDate;


        /*
            Generate schedule.
        */

        generateSchedule();

    }
);


/* =====================================================
   START APPLICATION
===================================================== */

generateSchedule();

</script>

</body>

</html>
