<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Machine Maintenance Scheduler</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
}

body {
    background: #f3f4f6;
    color: #1f2937;
    padding: 30px;
}

.container {
    max-width: 1200px;
    margin: auto;
}

h1 {
    text-align: center;
    margin-bottom: 8px;
    color: #111827;
}

.subtitle {
    text-align: center;
    color: #6b7280;
    margin-bottom: 25px;
}

/* =========================
   BACK BUTTON
========================= */

.back-link {
    display: inline-block;
    margin-bottom: 20px;
    padding: 8px 14px;
    background: #2563eb;
    color: white;
    text-decoration: none;
    border-radius: 6px;
}

.back-link:hover {
    background: #1d4ed8;
}

/* =========================
   CONTROLS
========================= */

.controls {
    background: white;
    padding: 20px;
    border-radius: 10px;
    margin-bottom: 25px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}

.controls label {
    font-weight: bold;
}

.controls input {
    padding: 9px 12px;
    margin-left: 10px;
    border: 1px solid #d1d5db;
    border-radius: 6px;
    font-size: 15px;
}

/* =========================
   SCHEDULE
========================= */

.schedule {
    display: grid;
    grid-template-columns: repeat(
        auto-fit,
        minmax(320px, 1fr)
    );
    gap: 20px;
}

.week {
    background: white;
    padding: 20px;
    border-radius: 10px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}

.week h2 {
    color: #2563eb;
    margin-bottom: 5px;
}

.week-date {
    color: #6b7280;
    font-size: 14px;
    margin-bottom: 18px;
}

/* =========================
   MACHINE
========================= */

.machine {
    background: #f9fafb;
    padding: 15px;
    margin-bottom: 12px;
    border-left: 5px solid #f59e0b;
    border-radius: 7px;
}

.machine.completed {
    background: #f0fdf4;
    border-left-color: #16a34a;
}

.machine-name {
    font-size: 18px;
    font-weight: bold;
}

.maintenance-day {
    color: #2563eb;
    font-weight: bold;
    margin-top: 6px;
}

.maintenance-date {
    color: #6b7280;
    font-size: 13px;
    margin-top: 4px;
}

.status {
    font-size: 13px;
    margin-top: 8px;
    color: #f59e0b;
}

.completed .status {
    color: #16a34a;
}

/* =========================
   BUTTON
========================= */

.complete-btn {
    margin-top: 10px;
    padding: 8px 14px;
    border: none;
    border-radius: 5px;
    background: #2563eb;
    color: white;
    cursor: pointer;
    font-size: 14px;
}

.complete-btn:hover {
    background: #1d4ed8;
}

.complete-btn.undo {
    background: #6b7280;
}

.complete-btn.undo:hover {
    background: #4b5563;
}

/* =========================
   SUMMARY
========================= */

.summary {
    margin-top: 25px;
    background: white;
    padding: 20px;
    border-radius: 10px;
    display: flex;
    justify-content: space-around;
    text-align: center;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}

.summary-item {
    min-width: 150px;
}

.number {
    display: block;
    font-size: 30px;
    font-weight: bold;
    color: #2563eb;
    margin-bottom: 5px;
}

/* =========================
   RESPONSIVE
========================= */

@media (max-width: 600px) {

    body {
        padding: 15px;
    }

    .summary {
        flex-direction: column;
        gap: 20px;
    }

    .controls input {
        margin-left: 0;
        margin-top: 10px;
        display: block;
    }

}

</style>

</head>

<a

<div class="container">

    <h1>

    </h1>

    <p class="subtitle">
        15 Machines • 3 Machines Per Week • Weekdays Only
    </p>


    <!-- =========================
         START DATE
    ========================== -->

    <div class="controls">

        <label for="startDate">
            Schedule Start Date:
        </label>

        <input
            type="date"
            id="startDate"
        >

    </div>


    <!-- =========================
         SCHEDULE
    ========================== -->

    <div
        id="schedule"
        class="schedule"
    ></div>


    <!-- =========================
         SUMMARY
    ========================== -->

    <div class="summary">

        <div class="summary-item">

            <span
                id="total"
                class="number"
            >
                15
            </span>

            Total Machines

        </div>


        <div class="summary-item">

            <span
                id="completed"
                class="number"
            >
                0
            </span>

            Completed

        </div>


        <div class="summary-item">

            <span
                id="pending"
                class="number"
            >
                15
            </span>

            Pending

        </div>

    </div>

</div>


<script>

/* =====================================================
   PASSWORD
===================================================== */

const PASSWORD = "123";


/* =====================================================
   MACHINE SETTINGS
===================================================== */

const MACHINES = [

    {
        id: "TBO1",
        name: "TBO1"
    },

    {
        id: "TBO2",
        name: "TBO2"
    },

    {
        id: "KOLBUS_ONLINE",
        name: "KOLBUS (ONLINE)"
    },

    {
        id: "KOLBUS_OFFLINE",
        name: "KOLBUS (OFFLINE)"
    },

    {
        id: "OSAKO",
        name: "OSAKO"
    },

    {
        id: "THREE_KNIFE",
        name: "THREE KNIFE"
    },

    {
        id: "SAKURAI_UNIT_2",
        name: "SAKURAI UNIT 2"
    },

    {
        id: "SAKURAI_UNIT_1_A",
        name: "SAKURAI UNIT 1 - A"
    },

    {
        id: "SAKURAI_UNIT_1_B",
        name: "SAKURAI UNIT 1 - B"
    },

    {
        id: "LAMINATING_MACHINE",
        name: "LAMINATING MACHINE"
    },

    {
        id: "SINGLE_KNIFE",
        name: "SINGLE KNIFE"
    },

    {
        id: "CTP",
        name: "CTP"
    },

    {
        id: "GENERATOR",
        name: "GENERATOR"
    },

    {
        id: "KOMPRESSOR_WEB",
        name: "KOMPRESSOR (WEB)"
    },

    {
        id: "KOMPRESSOR_KOLBUS",
        name: "KOMPRESSOR (KOLBUS)"
    }

];


/* =====================================================
   SETTINGS
===================================================== */

const TOTAL_MACHINES =
    MACHINES.length;

const MACHINES_PER_WEEK = 3;

const TOTAL_WEEKS =
    Math.ceil(
        TOTAL_MACHINES /
        MACHINES_PER_WEEK
    );


/*
    Monday = 1
    Wednesday = 3
    Friday = 5
*/

const MAINTENANCE_DAYS = [
    1,
    3,
    5
];


/* =====================================================
   STORAGE
===================================================== */

let maintenanceStatus =
    JSON.parse(
        localStorage.getItem(
            "maintenanceStatus"
        )
    ) || {};


/*
    Save selected start date separately.
*/

let savedStartDate =
    localStorage.getItem(
        "maintenanceStartDate"
    ) || "";


/* =====================================================
   ELEMENTS
===================================================== */

const scheduleElement =
    document.getElementById(
        "schedule"
    );

const startDateInput =
    document.getElementById(
        "startDate"
    );


/* =====================================================
   LOAD SAVED START DATE
===================================================== */

/*
    IMPORTANT:

    The date is NOT automatically set
    to today's date.

    If you already selected a date before,
    that date will be loaded.
*/

if (savedStartDate) {

    startDateInput.value =
        savedStartDate;

    startDateInput.dataset.previousDate =
        savedStartDate;

} else {

    startDateInput.value = "";

    startDateInput.dataset.previousDate =
        "";

}


/* =====================================================
   DATE FUNCTIONS
===================================================== */

function isWeekend(date) {

    const day =
        date.getDay();

    return (
        day === 0 ||
        day === 6
    );
}


function getNextWeekday(date) {

    const result =
        new Date(date);

    while (
        isWeekend(result)
    ) {

        result.setDate(
            result.getDate() + 1
        );

    }

    return result;
}


function getMonday(date) {

    const result =
        new Date(date);

    const day =
        result.getDay();


    if (day === 0) {

        result.setDate(
            result.getDate() - 6
        );

    } else {

        result.setDate(
            result.getDate() -
            (day - 1)
        );

    }

    return result;
}


function addDays(date, days) {

    const result =
        new Date(date);

    result.setDate(
        result.getDate() + days
    );

    return result;
}


function formatDate(date) {

    return date.toLocaleDateString(
        "en-US",
        {
            weekday: "long",
            year: "numeric",
            month: "short",
            day: "numeric"
        }
    );

}


/* =====================================================
   PASSWORD CHECK
===================================================== */

function checkPassword(message) {

    const enteredPassword =
        prompt(message);


    /*
        User pressed Cancel.
    */

    if (
        enteredPassword === null
    ) {

        return false;

    }


    /*
        Check password.
    */

    if (
        enteredPassword !== PASSWORD
    ) {

        alert(
            "Incorrect password!"
        );

        return false;

    }


    return true;

}


/* =====================================================
   GENERATE SCHEDULE
===================================================== */

function generateSchedule() {

    scheduleElement.innerHTML = "";


    /*
        If no start date has been entered,
        show a message instead of generating
        a schedule.
    */

    if (!startDateInput.value) {

        scheduleElement.innerHTML = `

            <div class="week">

                <h2>
                    Schedule Not Started
                </h2>

                <div class="week-date">

                    Please enter the
                    Schedule Start Date
                    above.

                </div>

            </div>

        `;

        updateSummary();

        return;
    }


    const selectedDate =
        new Date(
            startDateInput.value +
            "T00:00:00"
        );


    const firstMonday =
        getMonday(
            selectedDate
        );


    /*
        Create each week.
    */

    for (
        let week = 1;
        week <= TOTAL_WEEKS;
        week++
    ) {

        const monday =
            addDays(
                firstMonday,
                (week - 1) * 7
            );


        const friday =
            addDays(
                monday,
                4
            );


        const weekCard =
            document.createElement(
                "div"
            );


        weekCard.className =
            "week";


        weekCard.innerHTML = `

            <h2>
                Week ${week}
            </h2>

            <div class="week-date">

                ${formatDate(monday)}
                -
                ${formatDate(friday)}

            </div>

        `;


        const firstMachineIndex =
            (week - 1) *
            MACHINES_PER_WEEK;


        /*
            Create machines for this week.
        */

        for (
            let i = 0;
            i < MACHINES_PER_WEEK;
            i++
        ) {

            const machineIndex =
                firstMachineIndex + i;


            if (
                machineIndex >=
                TOTAL_MACHINES
            ) {

                break;

            }


            const machine =
                MACHINES[machineIndex];


            /*
                Calculate maintenance date.
            */

            const dayOffset =
                MAINTENANCE_DAYS[i] - 1;


            let maintenanceDate =
                addDays(
                    monday,
                    dayOffset
                );


            /*
                Make sure date is weekday.
            */

            if (
                isWeekend(
                    maintenanceDate
                )
            ) {

                maintenanceDate =
                    getNextWeekday(
                        maintenanceDate
                    );

            }


            /*
                Check completion status.
            */

            const completed =
                maintenanceStatus[
                    machine.id
                ] === true;


            /*
                Machine card.
            */

            const machineCard =
                document.createElement(
                    "div"
                );


            machineCard.className =
                completed
                    ? "machine completed"
                    : "machine";


            /*
                Machine name.
            */

            const machineName =
                document.createElement(
                    "div"
                );

            machineName.className =
                "machine-name";

            machineName.textContent =
                machine.name;


            /*
                Maintenance day.
            */

            const maintenanceDay =
                document.createElement(
                    "div"
                );

            maintenanceDay.className =
                "maintenance-day";

            maintenanceDay.textContent =
                maintenanceDate.toLocaleDateString(
                    "en-US",
                    {
                        weekday: "long"
                    }
                );


            /*
                Maintenance date.
            */

            const maintenanceDateElement =
                document.createElement(
                    "div"
                );

            maintenanceDateElement.className =
                "maintenance-date";

            maintenanceDateElement.textContent =
                maintenanceDate.toLocaleDateString(
                    "en-US",
                    {
                        month: "short",
                        day: "numeric",
                        year: "numeric"
                    }
                );


            /*
                Status.
            */

            const status =
                document.createElement(
                    "div"
                );

            status.className =
                "status";

            status.textContent =
                completed
                    ? "✓ Maintenance Completed"
                    : "⚠ Maintenance Pending";


            /*
                Button.
            */

            const button =
                document.createElement(
                    "button"
                );

            button.className =
                "complete-btn";


            if (completed) {

                button.textContent =
                    "Undo";

                button.classList.add(
                    "undo"
                );

            } else {

                button.textContent =
                    "Mark Completed";

            }
